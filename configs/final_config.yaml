# JARVIS_CHECKER Final Validated Pipeline Configuration
# Frozen Architecture Decisions

paths:
  s1_input: "dataset/test/test_source1.tsv"
  s2_input: "dataset/test/test_source2.tsv"
  s3_input: "dataset/test/test_source3.tsv"
  cache_dir: "dataset/pipeline_cache"
  model_path: "dataset/processed/lgb_model.pkl"
  output_tsv: "matching_results.tsv"

pipeline:
  chunksize: 250000
  random_seed: 42
  s2_s3_handling: "unified_model_simultaneous_processing"

normalization:
  lower_case: true
  remove_punctuation_regex: "[^a-zA-Z0-9\\s]"
  extract_address_numbers: "\\d+"

blocking:
  pass1: "country_norm + norm_name[:4]"
  pass2: "country_norm + addr_nums"

features:
  - name_fuzz_ratio
  - name_token_set
  - name_jw
  - addr_fuzz_ratio
  - addr_token_set
  - addr_num_overlap
  - cross_script

model:
  type: "LightGBM"
  version: "Stage 7D (no class weight)"
  trees: 500
  depth: 6
  threshold: 0.89
  strategy: "one-to-many"
  top_1_forcing: false
